<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0fb"><link rel="icon" href="/icon-192.png"><title>MiniGram Admin</title><style>
:root{--bg:#eef1fb;--card:#ffffffd9;--card-s:#fff;--text:#12183a;--muted:#7380a3;--line:#e2e7f6;--in:#f1f3fc;--acc:#6a5cff;--acc2:#4f8cff;--ink:#1f2a78;--ok:#16a064;--bad:#e5334f;--warn:#ff9d1a;--sh:0 8px 26px rgba(54,64,150,.10);--sh2:0 14px 40px rgba(54,64,150,.16);--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(900px 560px at -5% -10%,#d9d3fb,transparent 62%),radial-gradient(800px 520px at 108% -6%,#cfe4ff,transparent 60%),radial-gradient(900px 420px at 50% 112%,#f1dff0,transparent 65%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{padding:11px 14px;border-radius:13px;border:1px solid var(--line);background:var(--in);outline:none;min-width:0;margin:3px 0;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{resize:vertical;width:100%;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px #6a5cff2b}
input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--acc);flex:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* цветные плитки-иконки */
.tile{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:21px;box-shadow:0 5px 12px -4px var(--tc,#5b6dff),inset 0 1px 0 #ffffff55;background:linear-gradient(145deg,var(--t1,#6f9cff),var(--t2,#7b66ff))}
.tile.s{width:30px;height:30px;border-radius:10px;font-size:16px}.tile.l{width:46px;height:46px;border-radius:15px;font-size:24px}
.t-blue{--t1:#5b9bff;--t2:#6a5cff;--tc:#5b6dffaa}.t-green{--t1:#3ddc97;--t2:#16a064;--tc:#16a064aa}.t-orange{--t1:#ffc15a;--t2:#ff8f1f;--tc:#ff8f1faa}.t-pink{--t1:#ff7aa8;--t2:#e5337a;--tc:#e5337aaa}.t-red{--t1:#ff7b8f;--t2:#e5334f;--tc:#e5334faa}.t-purple{--t1:#8a7bff;--t2:#6a4cff;--tc:#6a4cffaa}.t-teal{--t1:#3ad9c8;--t2:#12998f;--tc:#12998faa}.t-gray{--t1:#9aa6c4;--t2:#6b7794;--tc:#6b7794aa}.t-sky{--t1:#4fc3ff;--t2:#2a86ee;--tc:#2a86eeaa}
.btn{border:0;cursor:pointer;padding:10px 16px;border-radius:13px;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 6px 16px -6px #5b6cffcc;transition:transform .08s,filter .12s;margin:2px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.55;pointer-events:none}
.btn.g{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}.btn.g:hover{background:var(--in)}
.btn.r{background:linear-gradient(135deg,#ff7b8f,#e5334f);box-shadow:0 6px 16px -6px #e5334fbb}.btn.y{background:linear-gradient(135deg,#ffd45a,#ff9d1a);color:#3a2600;box-shadow:0 6px 16px -6px #ff9d1abb}.btn.ok{background:linear-gradient(135deg,#3ddc97,#16a064);box-shadow:0 6px 16px -6px #16a064bb}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}.btn.w{width:100%;padding:13px;font-size:14px}
/* вход */
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .lc{width:100%;max-width:380px;padding:32px 26px 28px;background:linear-gradient(160deg,#1d2b80,#3b2f9a 55%,#6a38b8);border-radius:30px;box-shadow:0 30px 60px -20px #3b2f9a99,0 10px 24px -10px #1d2b8099;color:#fff;text-align:center;position:relative;overflow:hidden}
#login .lc::before{content:'';position:absolute;inset:-40% -30% auto auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(#ffffff26,transparent 65%)}
#login .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;font-size:32px;position:relative;box-shadow:0 12px 24px -8px #0006,inset 0 1px 0 #fff6;background:linear-gradient(145deg,#6f9cff,#8a5cff)}
#login h1{margin:0 0 4px;font-size:27px;letter-spacing:-.5px;position:relative}#login p{margin:0 0 20px;opacity:.78;font-size:13px;position:relative}
#login input{width:100%;background:#ffffff1f;border:1px solid #ffffff33;color:#fff;margin:5px 0;position:relative}#login input::placeholder{color:#ffffffa6}#login input:focus{background:#ffffff2e;border-color:#ffffff88;box-shadow:0 0 0 3px #ffffff22}
#login .btn{width:100%;padding:14px;font-size:14px;margin:12px 0 0;position:relative;background:linear-gradient(135deg,#4f8cff,#7b66ff);box-shadow:0 10px 22px -8px #1d2b80}
#err{color:#ffc2cb;min-height:20px;margin-top:10px;font-weight:600;font-size:13px;position:relative}

#app{display:none;min-height:100vh}#app.on{display:flex}

.nvs{flex:1}
.nv{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;border-radius:14px;background:none;color:#4b5678;font-weight:700;font-size:13.5px;cursor:pointer;text-align:left;margin:2px 0;transition:background .12s}
.nv:hover{background:#ffffffa6}.nv.on{background:linear-gradient(135deg,#dcd8ff,#e2e6ff);color:var(--ink);box-shadow:inset 0 0 0 1px #c9c4ff}.nv.on::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--acc2),var(--acc))}
.nv .tile{width:30px;height:30px;font-size:16px;border-radius:10px}
.nv .bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:800}
.me{margin:12px 2px 0;padding:11px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:12.5px;box-shadow:var(--sh)}
.me .r1{display:flex;align-items:center;gap:10px}.me b{display:block;font-size:13.5px}.me small{color:var(--muted);font-size:11.5px}.me .btn{width:100%;margin:10px 0 0}
section{flex:1;min-width:0;padding:22px 24px 70px;max-width:1180px}
.ph{display:flex;align-items:center;gap:14px;margin:0 0 18px}.ph h2{margin:0;font-size:25px;letter-spacing:-.5px;line-height:1.15}.ph p{margin:3px 0 0;color:var(--muted);font-size:13px}
h3{margin:0 0 6px;font-size:15.5px;letter-spacing:-.2px}
.card{background:var(--card);border:1px solid #ffffff;border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.card.red{border-color:#ffb3bd;background:#fff6f7d9}.card.hl{background:linear-gradient(135deg,#1d2b80,#3b2f9a);border:0;color:#fff}
.m{color:var(--muted);font-size:12.5px;margin:3px 0 10px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input,.row>select{flex:1 1 150px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}
.stat{display:flex;align-items:center;gap:13px;border-radius:19px;padding:13px 14px;background:var(--card);border:1px solid #fff;box-shadow:var(--sh);min-width:0}
.stat b{display:block;font-size:22px;letter-spacing:-.5px;line-height:1.1}.stat span{color:var(--muted);font-size:11.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hl{background:linear-gradient(150deg,#2c2a9c,#171b60);border:0;color:#fff;box-shadow:0 14px 28px -12px #2c2a9ccc}.stat.hl span{color:#ffffffb8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:8px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}.chip:hover{border-color:#bdb6ff}.chip.on{background:linear-gradient(135deg,#5b8cff,#7b66ff);color:#fff;border-color:transparent;box-shadow:0 6px 14px -6px #5b6cffcc}
.sec-t{margin:22px 4px 8px;font-size:15px;font-weight:800}
.day{margin:18px 4px 6px;color:var(--muted);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em}
.lg{display:flex;gap:12px;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid #fff;box-shadow:0 3px 12px rgba(54,64,150,.07);margin:7px 0;align-items:center}
.lg .t{font-size:13.5px;line-height:1.4;word-break:break-word;font-weight:600}.lg .d{color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:500}
.pl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;background:#fff;border:1px solid #fff;box-shadow:0 3px 12px rgba(54,64,150,.07);margin:7px 0;cursor:pointer;transition:transform .1s,box-shadow .1s}.pl:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex:none;box-shadow:0 4px 10px -3px #0003}.pl .i{flex:1;min-width:0}.pl .i b{display:block}.pl .i small{color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;background:var(--in);color:var(--muted);margin:2px 3px 0 0}.tag.fz{background:#d8efff;color:#06527f}.tag.bn{background:#ffdcdc;color:#8a0000}.tag.on{background:#d4f5e2;color:#0a6a38}.tag.pu{background:#e6e2ff;color:#4a3bd0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}tr:last-child td{border:0}.gi{width:44px;height:44px;object-fit:contain}.scroll{overflow-x:auto}
.ov{position:fixed;inset:0;background:#0f1640a6;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(6px)}
.box{background:#f6f7fe;border:1px solid #fff;border-radius:26px;padding:20px;width:100%;max-width:660px;box-shadow:var(--sh2)}.box h3{font-size:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}.kv div{background:#fff;border-radius:15px;padding:10px 13px;font-size:13px;box-shadow:0 2px 8px rgba(54,64,150,.06)}.kv div b{display:block;font-size:15.5px;margin-top:2px}.kv span{color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:8px 0}.card.hl .perms label{color:#eaf0ff;background:#ffffff1f}.perms label{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--in);font-size:13px;cursor:pointer}
.field{display:block;margin:8px 0}.field>span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}.field input,.field select{width:100%}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1d2b80;color:#fff;padding:12px 20px;border-radius:18px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:92%;text-align:center;font-weight:700;font-size:14px;box-shadow:var(--sh2)}#toast.on{opacity:1;transform:translateX(-50%)}#toast.bad{background:#c4223a}
/* рассылка / поддержка */
.counter{font-size:11.5px;color:var(--muted);margin:2px 2px 10px}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 14px;font-size:13px;color:#4b5678;cursor:pointer;font-weight:600}
.pv{display:flex;gap:10px;align-items:flex-end;margin-top:4px}.pv .bub,.bub{background:#fff;border-radius:16px 16px 16px 5px;padding:9px 13px;font-size:13.5px;box-shadow:0 3px 12px rgba(54,64,150,.12);max-width:min(520px,100%);white-space:pre-wrap;word-break:break-word;line-height:1.45}.pv .bub.e{color:var(--muted)}
.sup{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}.sup .list{max-height:540px;overflow:auto}
.sp{display:flex;gap:10px;align-items:center;padding:10px;border-radius:15px;cursor:pointer;border:1px solid transparent}.sp:hover{background:#fff}.sp.on{background:#fff;border-color:#d7d2ff;box-shadow:var(--sh)}.sp small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}.sp .i{min-width:0;flex:1}
.th{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow:auto;padding:4px 2px;margin:8px 0}.th .bub{align-self:flex-start}.th .bub.me2{align-self:flex-end;background:linear-gradient(135deg,#5b8cff,#7b66ff);color:#fff;border-radius:16px 16px 5px 16px}.th small{display:block;opacity:.6;font-size:10.5px;margin-top:3px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.sup{grid-template-columns:1fr}}
@media(max-width:820px){#app.on{display:block}nav{position:sticky;z-index:10;width:100%;height:auto;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;padding:9px 10px;border-right:0;border-bottom:1px solid #ffffffb3;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.brand,.me{display:none}.nvs{display:flex;gap:4px;flex:none}.nv{width:auto;flex:none;padding:6px 12px 6px 7px;white-space:nowrap;border-radius:18px;background:#ffffffb3;margin:0}.nv.on::before{display:none}section{padding:16px 12px 80px}.ph h2{font-size:21px}.mobout{display:flex!important}.stat b{font-size:19px}}
@media(max-width:480px){.stats{gap:9px}.stat{padding:11px;gap:10px}.stat .tile{width:34px;height:34px;font-size:18px}}
.mobout{display:none}
</style></head><body>
<div id="login"><div class="lc"><div class="tile logo" id="lgo"></div><h1>MiniGram</h1><p>Админ-панель. Войдите под своим логином.</p><input id="lg" placeholder="Логин (владелец: owner)" autocapitalize="off" autocomplete="username"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn" onclick="doLogin()">Войти</button><div id="err"></div></div></div>
<div id="app"><nav id="nav"></nav><section id="main"></section></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let TOK=sessionStorage.tok||'',OP=null,CUR=sessionStorage.sec||'',GF={},UI={};
/* ---------- иконки ---------- */

$('#lgo').append(svg('plane'));

function toast(t,bad){const x=$('#toast');x.textContent=t;x.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='',3200)}
const api=(p,m,b)=>fetch('/api/admin/'+p,{method:m||'GET',headers:{'x-admin':TOK},body:b?JSON.stringify(b):undefined}).then(async r=>{const d=await r.json().catch(()=>({}));if(r.status==401&&OP){logout()}return r.ok?d:Promise.reject(d)});
const can=p=>OP&&(OP.owner||OP.perms.includes(p));
const fdt=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
