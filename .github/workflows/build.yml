name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Prepare Clean Folder
        run: |
          mkdir www
          cp *.html www/ || true
          cp *.css www/ || true
          cp *.js www/ || true
          cp *.png www/ || true
          cp *.jpg www/ || true
      - name: Build App
        run: |
          cd www
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MiniGram com.minigram.app --web-dir=.
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniGram-APK
          path: www/android/app/build/outputs/apk/debug/app-debug.apk
