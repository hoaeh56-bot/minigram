name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Move web files to www
        run: |
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/www || true
      - name: Init Capacitor in separate folder
        run: |
          cd www
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MiniGram com.minigram.app --web-dir=.
          npx cap add android
      - name: Build APK
        run: |
          cd www/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniGram-APK
          path: www/android/app/build/outputs/apk/debug/app-debug.apk
