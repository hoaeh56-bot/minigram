name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          # Копируем все файлы, кроме системных и серверных
          find . -maxdepth 1 -type f ! -name "package.json" ! -name "server.js" ! -name "*.yml" -exec cp {} www/ \;
          find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "www" ! -name "android" -exec cp -r {} www/ \;
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MiniGram com.minigram.app --web-dir=www
          npx cap add android
          npx cap copy
      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
